<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图片查看器</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 冷启动防闪烁：在 React 挂载前预置 data-theme
      try {
        var s = JSON.parse(localStorage.getItem('theme-storage') || '{}');
        var enabled = s?.state?.enabled;
        var mode = s?.state?.mode || 'dark';
        if (enabled) {
          var resolved = mode === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : mode;
          document.documentElement.dataset.theme = resolved;
          if (s?.state?.accentColor) {
            document.documentElement.style.setProperty('--color-accent', s.state.accentColor);
          }
        } else {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch(e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
